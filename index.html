<html lang="nl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotterdam 2027 – dashboard</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12202b;--mut:#587083;--line:#d8e1e7;
--p0:#0f8b8d;--p1:#2f6fd0;--p2:#7a4fd1;--p3:#e0602a;--p4:#2f9e5b;
--kwal-b:#ffe3d1;--kwal-t:#963a0b;--lang-b:#d9e7ff;--lang-t:#1b4693;--run-b:#e5ecf1;--run-t:#3a4f5f;
--gym-b:#ebe2ff;--gym-t:#55309f;--zwem-b:#d3f2f5;--zwem-t:#0a636d;--race-b:#ffe7a0;--race-t:#5e4300;--rust-t:#7b8c99;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141b;--card:#142230;--ink:#e8eff4;--mut:#8ea3b2;--line:#25384a;
--kwal-b:#4a2412;--kwal-t:#ffb48f;--lang-b:#17305c;--lang-t:#a9c8ff;--run-b:#243845;--run-t:#b8cad6;--gym-b:#33235c;--gym-t:#cdb8ff;--zwem-b:#0c3e44;--zwem-t:#8fe0ea;--race-b:#5a4400;--race-t:#ffe08a;--rust-t:#7f93a1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141b;--card:#142230;--ink:#e8eff4;--mut:#8ea3b2;--line:#25384a;
--kwal-b:#4a2412;--kwal-t:#ffb48f;--lang-b:#17305c;--lang-t:#a9c8ff;--run-b:#243845;--run-t:#b8cad6;--gym-b:#33235c;--gym-t:#cdb8ff;--zwem-b:#0c3e44;--zwem-t:#8fe0ea;--race-b:#5a4400;--race-t:#ffe08a;--rust-t:#7f93a1;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:clamp(12px,1.6vh,18px)/1.35 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.dash{height:100%;box-sizing:border-box;padding:2.4vh 2.4vw;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}
.top{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:1.6vw}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.4vh;padding:1.6vh 1.2vw;min-width:0}
.lab{color:var(--mut);font-size:.85em;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.big{font:700 clamp(40px,11vh,130px)/.95 "Barlow Condensed","Barlow",system-ui,sans-serif;letter-spacing:.5px}
.mid{font:700 clamp(20px,4vh,46px)/1.05 "Barlow Condensed","Barlow",system-ui,sans-serif}
.pc{border-left:.8vh solid var(--pc)}
.today .it{margin-top:.8vh;font-size:1.25em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.9vw;min-height:0}
.day{background:var(--card);border:1px solid var(--line);border-top:.7vh solid var(--pc);border-radius:1.2vh;padding:1.2vh .7vw;overflow:hidden;min-width:0}
.day.now{box-shadow:0 0 0 .3vh var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--card))}
.day.past{opacity:.5}
.dn{font:700 1.6em/1 "Barlow Condensed","Barlow",system-ui,sans-serif;margin-bottom:.8vh}.dn small{color:var(--mut);font:500 .6em "Barlow",system-ui,sans-serif;margin-left:.4em}
.it{display:flex;flex-direction:column;align-items:flex-start;gap:.3vh;margin-bottom:1vh;overflow-wrap:anywhere}
.chip{font-size:.78em;font-weight:700;padding:.1vh .7em;border-radius:20px}
.chip.kwal{background:var(--kwal-b);color:var(--kwal-t)}.chip.lang{background:var(--lang-b);color:var(--lang-t)}
.chip.run{background:var(--run-b);color:var(--run-t)}.chip.gym{background:var(--gym-b);color:var(--gym-t)}
.chip.zwem{background:var(--zwem-b);color:var(--zwem-t)}.chip.race{background:var(--race-b);color:var(--race-t)}
.chip.rust{background:none;color:var(--rust-t);padding-left:0}
.chart{display:grid;grid-template-columns:auto 1fr;gap:1.2vw;align-items:center}
svg{width:100%;height:15vh;display:block}
.leg{display:flex;flex-wrap:wrap;gap:.4vh 1em;font-size:.8em;color:var(--mut);margin-top:.6vh}
.leg i{display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:.4em;vertical-align:-.1em}
.nxt{color:var(--mut);margin-top:.6vh}
.nav{display:flex;gap:.6vw;margin-top:1vh}.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 1em "Barlow",system-ui,sans-serif;padding:.7vh 1vw;border-radius:1vh;cursor:pointer}.nav button:hover{background:var(--line)}
.day{cursor:pointer}.day input{width:1.5em;height:1.5em;accent-color:var(--pc);float:right;margin:0;cursor:pointer}.day.sel{outline:.3vh dashed var(--pc);outline-offset:.2vh}

.ph{position:fixed;top:0;bottom:0;pointer-events:none;background-size:cover;background-repeat:no-repeat;z-index:0;opacity:.34}
.ph-r{right:0;width:46vw;background-position:50% 60%;-webkit-mask-image:linear-gradient(to left,#000 30%,transparent 100%);mask-image:linear-gradient(to left,#000 30%,transparent 100%)}
.ph-l{left:0;width:38vw;-webkit-mask-image:linear-gradient(to right,#000 25%,transparent 100%);mask-image:linear-gradient(to right,#000 25%,transparent 100%)}
.ph-l i{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;animation:xf 60s ease-in-out infinite}
.ph-l i+i{animation-delay:-30s}
@keyframes xf{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ph-l i{animation:none}.ph-l i+i{display:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph{opacity:.44}}
:root[data-theme="dark"] .ph{opacity:.44}
.dash{position:relative;z-index:1}
.card,.day{background:color-mix(in srgb,var(--card) 76%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.day.now{background:color-mix(in srgb,var(--pc) 22%,color-mix(in srgb,var(--card) 76%,transparent))}

.bot{display:grid;grid-template-columns:1.5fr 1.3fr 1.2fr;gap:1.2vw;min-height:0}
.cal{display:grid;grid-template-columns:20px repeat(22,1fr);gap:2px;align-items:center}.cw{font-size:9px;color:var(--mut);text-align:center;white-space:nowrap}.cl{font-size:10px;color:var(--mut)}.cc{display:block;aspect-ratio:1;border-radius:3px;box-sizing:border-box;border:1px solid transparent;cursor:pointer}.cc.r{background:var(--line);opacity:.35}.cc.p{border-color:var(--mut);opacity:.6}.cc.rc{background:var(--race-b);border-color:var(--race-t)}.cc.td{box-shadow:0 0 0 2px var(--ink)}
#mk h2{font:700 1.5em/1 "Barlow Condensed","Barlow",system-ui,sans-serif;margin:0 0 .6vh}#mk .note,#mk .legend{display:none}
.bst{font:600 1.05em/1.3 "Barlow",system-ui,sans-serif;margin:.5vh 0 .8vh}
.mg{display:flex;gap:.6vw;overflow-x:auto;padding-bottom:.4vh}.mc{flex:none;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}.mc svg{width:5.2vh;min-width:44px;height:auto;display:block}.mc span,.mc small{display:none}.mc.lk svg{filter:grayscale(1);opacity:.35}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.md[hidden],.tst[hidden]{display:none}
.mb{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:18px;max-height:85vh;overflow:auto;text-align:center}.mb svg{width:150px;height:auto}.mb.lk svg{filter:grayscale(1);opacity:.45}.mb h3{font:700 28px/1.1 "Barlow Condensed","Barlow",system-ui,sans-serif;margin:4px 0}.mb p{text-align:left;margin:0 0 10px}.mb .note{text-align:center}
.mb .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 12px}.mb .bar i{display:block;height:100%;background:var(--p1);border-radius:6px}
.cb{margin-top:4px;padding:9px 18px;border:0;border-radius:10px;background:var(--p1);color:#fff;font:600 15px "Barlow",system-ui,sans-serif;cursor:pointer}
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
</style>

function ptime(s,lg){s=(s||'').trim();var a=s.split(':').map(Number);if(!s||a.some(isNaN)||a.length<2||a.length>3)return 0;var h=0,m,x;if(a.length===3){h=a[0];m=a[1];x=a[2];if(m>59)return 0}else if(lg){h=a[0];m=a[1];x=0;if(m>59)return 0}else{m=a[0];x=a[1]}if(x>59)return 0;return h*3600+m*60+x}
function fmtT(t){var h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=Math.round(t%60);return h?h+':'+('0'+m).slice(-2)+':'+('0'+x).slice(-2):m+':'+('0'+x).slice(-2)}
function faster(t,a){if(t<=a[0])return 99.5;if(t>a[9])return -1;for(var i=0;i<9;i++)if(t<=a[i+1])return 100-(PCT[i]+(t-a[i])/(a[i+1]-a[i])*(PCT[i+1]-PCT[i]));return -1}
function fillPR(){for(var id in PM){var el=document.getElementById(id);if(el)el.value=PR[PM[id]]||(id==='prg'?'a':'')}}
function onPR(e){var k=PM[e.target.id];if(!k)return;PR[k]=e.target.value.trim();try{localStorage.setItem('mt27r',JSON.stringify(PR))}catch(x){}save();renderPR()}
function initPR(){var el=document.getElementById('prc');if(!el)return;el.innerHTML='<h2>Persoonlijke records</h2><p class="note">Vul je beste tijden in. Voor 5 km, 10 km, halve marathon en marathon vergelijk ik ze met wedstrijdlopers.</p><label class="f">Vergelijk met<select id="prg"><option value="a">Alle deelnemers</option><option value="m">Mannen</option><option value="f">Vrouwen</option></select></label><label class="f">5 km<input id="pr5" placeholder="mm:ss"></label><label class="f">10 km<input id="pr10" placeholder="mm:ss"></label><label class="f">Halve marathon<input id="prh" placeholder="u:mm:ss"></label><label class="f">Marathon<input id="prm" placeholder="u:mm:ss"></label><label class="f">Kwart marathon (10,55 km)<input id="prq" placeholder="mm:ss"></label><label class="f">Zwemmen 1000 m<input id="prs" placeholder="mm:ss"></label><label class="f">Langste fietstocht (km)<input id="prb" inputmode="decimal" placeholder="km"></label><div id="prr"></div>';fillPR();el.addEventListener('input',onPR);el.addEventListener('change',onPR);renderPR()}
function renderPR(){var el=document.getElementById('prr');if(!el)return;var gi={a:0,m:1,f:2}[PR.g]||0,gl={a:'alle deelnemers',m:'mannen',f:'vrouwen'}[PR.g]||'alle deelnemers',h='',best=null;
['p5','p10','ph','pm'].forEach(function(k){var d=PD[k],t=ptime(PR[k],k==='ph'||k==='pm');if(!t)return;var r=faster(t,d[1][gi]),txt=r>=99?'sneller dan 99%':r<0?'sneller dan minder dan 10%':'sneller dan '+Math.round(r)+'%';if(!best||r>best.r)best={n:d[0],r:r,txt:txt};
h+='<div class="pr"><div><b>'+d[0]+'</b> '+fmtT(t)+'</div><div class="bar"><i style="width:'+Math.max(2,Math.min(100,r<0?2:r))+'%;background:var(--p4)"></i></div><span class="note">'+txt+' van de wedstrijdlopers ('+gl+')</span></div>'});
var q=ptime(PR.pq,false),s=ptime(PR.ps,false),b=parseFloat(String(PR.pb||'').replace(',','.'));
if(q)h+='<div class="pr"><b>Kwart marathon (10,55 km)</b> '+fmtT(q)+' · '+mm(q/10.55)+' /km</div>';if(s)h+='<div class="pr"><b>Zwemmen 1000 m</b> '+fmtT(s)+' · '+mm(s/10)+' /100 m</div>';if(b>0)h+='<div class="pr"><b>Langste fietstocht</b> '+f1(b)+' km</div>';
if(!h){el.innerHTML='<p class="note">Vul minstens één record in om je vergelijking te zien.</p>';return}
el.innerHTML=(best?'<p><b>Je sterkste afstand:</b> '+best.n+' ('+best.txt+')</p>':'')+h+'<p class="note">Bron: RunRepeat-percentielen uit ruim 35 miljoen race-uitslagen van meer dan 28.000 wedstrijden (bijgewerkt maart 2024). Dit vergelijkt je met mensen die een wedstrijd hebben uitgelopen, niet met alle hardlopers, en houdt geen rekening met leeftijd. Tussen de bekende percentielen is lineair geïnterpoleerd.</p>'}
function renderCal(){var el=document.getElementById('mk');if(!el)return;var n0=new Date();n0.setHours(0,0,0,0);var td=Math.round((n0-S)/D),h='<h2>Kalender</h2><p class="note">Elk vakje is een dag. Hoe donkerder, hoe meer kilometers je liep. Tik op een vakje voor details.</p><div class="cal"><span></span>';
for(var w=0;w<22;w++)h+='<span class="cw">'+((w+1)%5===0||w===0?(w+1):'')+'</span>';
for(var j=0;j<7;j++){h+='<span class="cl">'+DN[j]+'</span>';for(var i=0;i<22;i++){var its=build(i)[j],act=its.some(function(x){return x[0]!=='rust'}),k=(i+1)+'-'+j,dk=dayKm(its),ok=!!st[k],rk=ok?(ACT[k]!=null?ACT[k]:dk):0,cl='cc',sty='';
if(!act)cl+=' r';else if(!ok)cl+=' p';else if(its.some(function(x){return x[0]==='race'}))cl+=' rc';else if(rk>0){var lv=rk<5?22:rk<10?38:rk<15?54:rk<22?70:rk<30?85:100;sty=' style="background:color-mix(in srgb,var(--p1) '+lv+'%,var(--card))"'}else sty=' style="background:color-mix(in srgb,var(--p0) 45%,var(--card))"';
if((i*7+j)===td)cl+=' td';h+='<i class="'+cl+'" data-c="'+i+'-'+j+'"'+sty+'></i>'}}
h+='</div><div class="legend" style="margin-top:8px"><span>Blauw: gelopen (donkerder = meer km)</span><span>Groen: zwemmen of gym</span><span>Rand: gepland</span><span>Dikke rand: vandaag</span></div>';el.innerHTML=h}
document.addEventListener('click',function(e){var c=e.target.dataset&&e.target.dataset.c;if(!c)return;var p=c.split('-'),i=+p[0],j=+p[1],its=build(i)[j],k=(i+1)+'-'+j,act=its.some(function(x){return x[0]!=='rust'}),dk=dayKm(its),ok=!!st[k],rk=ACT[k]!=null?ACT[k]:dk,dt=new Date(2026,10,9+7*i+j);
toast('Week '+(i+1)+' · '+DN[j]+' '+dt.getDate()+' '+MN[dt.getMonth()]+': '+(!act?'rust':ok?(rk>0?f1(rk)+' km gelopen':'afgevinkt'):'gepland'+(dk>0?', '+f1(dk)+' km':'')))});
DEF=DEF.filter(function(d){return d.id!=='nerd'});
function MS(){var M={runs:0,km:0,long:0,wkc:0,streak:0,wk:0,eff:0},run=0,q;
for(var i=0;i<22;i++){var ds=build(i),all=true,any=false,wk=0;
ds.forEach(function(its,j){if(!its.some(function(x){return x[0]!=='rust'}))return;any=true;var k=(i+1)+'-'+j,dk=dayKm(its);if(!st[k]){all=false;return}var rk=ACT[k]!=null?ACT[k]:dk;if(dk>0){M.runs++;M.km+=rk;wk+=rk;if(rk>M.long)M.long=rk}});
if(wk>M.wk)M.wk=wk;if(any&&all){M.wkc++;run++;if(run>M.streak)M.streak=run}else run=0}
for(q in EFF)if(EFF[q].p&&EFF[q].h)M.eff++;return M}
function renderMs(){var g=document.getElementById('mg');if(!g)return;var M=MS(),h='',n=0;DEF.forEach(function(d){var r=d.f(M),ok=r[0]>=r[1];if(ok)n++;h+='<button class="mc'+(ok?'':' lk')+'" data-ms="'+d.id+'">'+medal(d.t,d.lab,'g_'+d.id)+'<span>'+d.n+'</span><small>'+(ok?'Behaald':f1(Math.min(r[0],r[1]))+'/'+f1(r[1])+(d.u?' '+d.u:''))+'</small></button>'});
g.innerHTML=h;document.getElementById('msn').textContent=n+' van '+DEF.length+' medailles behaald. Tik op een medaille voor het verhaal erachter.';renderCal()}
function checkMs(f){var M=MS(),nw=[];DEF.forEach(function(d){var r=d.f(M);if(r[0]>=r[1]&&SEEN.indexOf(d.id)<0){SEEN.push(d.id);nw.push(d)}});
if(nw.length){try{localStorage.setItem('mt27m',JSON.stringify(SEEN))}catch(e){}if(f){boom(60);toast('Mijlpaal behaald: '+nw.map(function(d){return d.n}).join(', '))}}}
function toast(m){var d=document.getElementById('tst');if(!d)return;d.textContent=m;d.hidden=false;clearTimeout(TT);TT=setTimeout(function(){d.hidden=true},3500)}
function boom(n){if(BZ||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;BZ=1;var cv=document.createElement('canvas'),x=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=['#e0602a','#2f6fd0','#7a4fd1','#2f9e5b','#d4a017','#0f8b8d'],P=[],t0=performance.now();
cv.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:70';document.body.appendChild(cv);
for(var i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:5+Math.random()*4,c:cs[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.4});
(function f(t){var e=t-t0;x.clearRect(0,0,W,H);P.forEach(function(p){p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-e/1800);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(e<1800)requestAnimationFrame(f);else{cv.remove();BZ=0}})(t0)}
function openMs(id){var d=DEF.filter(function(z){return z.id===id})[0];if(!d)return;var r=d.f(MS()),ok=r[0]>=r[1],pc=Math.min(100,Math.round(r[0]/r[1]*100)),m=document.getElementById('md');
m.innerHTML='<div class="mb'+(ok?'':' lk')+'" role="dialog" aria-label="'+d.n+'">'+medal(d.t,d.lab,'g_'+d.id+'_m')+'<h3>'+d.n+'</h3><p class="note" style="text-align:center">'+TN[d.t-1]+' · '+(ok?'behaald':'nog niet behaald')+'</p><div class="bar"><i style="width:'+pc+'%"></i></div><p><b>Doel:</b> '+d.g+'</p><p>'+d.d+'</p><button class="cb" data-cl>Sluiten</button></div>';m.hidden=false}
